# Студент: Яровий Михайло, група КН-42
# CI/CD: тести -> збірка образу -> push у Docker Hub (тег = короткий хеш коміту) -> deploy через docker compose (образ з Docker Hub) -> [опційно] EC2
name: Build, push to Docker Hub and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Unit tests
        run: |
          npm ci
          npm run check
          npm test

      - name: Short commit hash
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp
          # тег короткого хешу (type=sha) задано явно через SHORT_SHA у кроці Build and push
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ env.SHORT_SHA }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Розгортання стеку через docker compose на сервері GitHub Actions:
  # образ НЕ збирається, а завантажується з Docker Hub за тегом короткого хешу коміту
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from Docker Hub and start stack
        run: |
          docker compose config --quiet
          docker rm -f nodeapp || true
          docker compose pull app
          docker compose up -d --no-build
          docker compose ps

      - name: Verify app and PostgreSQL
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health > /dev/null 2>&1 && break
            sleep 2
          done
          echo "== GET /";       curl -fsS http://localhost:3000/;       echo
          echo "== GET /health"; curl -fsS http://localhost:3000/health; echo
          curl -fsS http://localhost:3000/ | grep -q "\"imageTag\":\"$IMAGE_TAG\""
          curl -fsS http://localhost:3000/ | grep -q '"db":"connected"'
          docker compose logs app | grep "Connected to PostgreSQL database successfully!"
          echo "== Running image: $(docker inspect nodeapp --format '{{.Config.Image}}')"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  # Розгортання на Amazon EC2. Вимкнено, доки немає сервера:
  # увімкнути — Settings → Secrets and variables → Actions → Variables → EC2_DEPLOY = true
  deploy-ec2:
    needs: [build-and-push, deploy]
    if: vars.EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: nodeapp

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -e
            # Новий інстанс від Terraform: дочекатися, поки user_data встановить Docker
            sudo cloud-init status --wait >/dev/null 2>&1 || true
            for i in $(seq 1 30); do docker compose version >/dev/null 2>&1 && break; sleep 5; done
            cd ~/nodeapp
            export DOCKERHUB_USERNAME IMAGE_TAG
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Старий застосунок під pm2 (практичні 5-6) займав би порт 3000
            if command -v pm2 >/dev/null 2>&1; then pm2 delete all || true; fi
            docker compose pull app
            docker rm -f nodeapp || true
            docker compose up -d --no-build
            docker image prune -f
            docker compose ps
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/health; then echo; echo "Deployed IMAGE_TAG=$IMAGE_TAG"; exit 0; fi
              sleep 2
            done
            docker compose logs --tail=50 app
            exit 1
